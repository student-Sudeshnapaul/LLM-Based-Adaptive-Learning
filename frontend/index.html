<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teacher Portal – AI Assessment</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- LOGIN -->
  <section id="loginView" class="login-wrap">
    <div class="login-card">
      <div class="brand"><span class="logo">✎</span> EvalAI</div>
      <h1>Teacher Login</h1>
      <p class="muted">AI Assessment & Learning Analytics</p>
      <form id="loginForm">
        <label>College Email</label>
        <input type="email" id="email" placeholder="name@college.edu" required />
        <label>Password</label>
        <div class="pw">
          <input type="password" id="password" placeholder="••••••" required />
          <button type="button" id="togglePw">Show</button>
        </div>
        <p id="loginError" class="error"></p>
        <button class="btn primary full" type="submit">Sign in</button>
      </form>
      <div class="demo-box">
        <b>Demo accounts</b> (password: demo123)<br />
        ananya.sen@college.edu · rahul.das@college.edu · priya.ghosh@college.edu
      </div>
    </div>
  </section>

  <!-- APP -->
  <div id="appView" class="app hidden">
    <aside class="sidebar">
      <div class="brand"><span class="logo">✎</span> EvalAI</div>
      <nav>
        <a data-nav="dashboard">Dashboard</a>
        <a data-nav="subjects">My Subjects</a>
        <a data-nav="students">Students</a>
        <a data-nav="evaluations">AI Evaluations</a>
        <a data-nav="profile">Profile</a>
      </nav>
      <button class="btn ghost" id="logoutBtn">Logout</button>
    </aside>
    <main>
      <header class="topbar">
        <button id="menuBtn" class="menu">☰</button>
        <div id="crumbs"></div>
        <div class="user-chip" id="userChip"></div>
      </header>
      <div id="content"></div>
    </main>
  </div>

  <div id="modal" class="modal hidden"><div class="modal-box" id="modalBox"></div></div>

  <script src="db.js"></script>
  <script src="app.js"></script>
</body>
</html>
